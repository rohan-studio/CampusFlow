<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — CampusFlow</title>
  <meta name="description" content="Admin portal login for CampusFlow complaint management." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ══ Full-Page Auth Layout ═══════════════════════════════ -->
  <div class="auth-page">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>

    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <img src="assets/logo.svg" alt="CampusFlow Logo" class="auth-logo-img" width="64" height="64" />
        <h1 class="brand-name" style="font-size: 1.65rem;">Campus<span class="brand-flow">Flow</span></h1>
        <p>Admin Portal — Sign in to continue</p>
      </div>

      <!-- Error Box -->
      <div class="auth-error" id="login-error" role="alert" style="display:none; align-items:center; gap:8px;">
        <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" style="color:var(--danger);"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span class="error-msg">Invalid credentials. Please try again.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">
            Username <span class="required">*</span>
          </label>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Enter admin username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Password <span class="required">*</span>
          </label>
          <div style="position:relative;">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              style="padding-right: 48px;"
            />
            <button
              type="button"
              id="toggle-password"
              aria-label="Toggle password visibility"
              style="
                position:absolute; right:12px; top:50%; transform:translateY(-50%);
                background:none; border:none; cursor:pointer;
                color: var(--text-muted); padding:4px; display:inline-flex; align-items:center; justify-content:center;
              "
            >
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-full" type="submit" id="login-btn" style="margin-top:8px;">
          <span id="login-btn-text" style="display:inline-flex; align-items:center; justify-content:center; gap:6px;">
            Sign In
            <svg class="ui-icon" width="15" height="15" viewBox="0 0 24 24" style="stroke:#fff;"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
        </button>
      </form>

      <!-- Back Link -->
      <div style="text-align:center; margin-top:24px;">
        <a
          href="index.html"
          style="font-size:.875rem; color:var(--text-muted); transition:var(--transition);"
          onmouseover="this.style.color='var(--accent)'"
          onmouseout="this.style.color='var(--text-muted)'"
        >
          ← Back to CampusFlow
        </a>
      </div>

      <!-- Security Note -->
      <div style="
        margin-top: 24px;
        padding: 12px 16px;
        background: var(--bg);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        display:flex; align-items:flex-start; gap:10px;
      ">
        <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" style="color:var(--text-muted);margin-top:2px;"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <p style="font-size:.78rem; color:var(--text-muted); line-height:1.5; margin:0;">
          This portal is restricted to authorized administrators only.
          Unauthorized access attempts are logged.
        </p>
      </div>

    </div>
  </div>

  <!-- ══ Scripts ═════════════════════════════════════════════ -->
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script>
    /* Toggle password visibility */
    const eyeSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const eyeOffSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;

    document.getElementById('toggle-password').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      const isHidden = pwd.type === 'password';
      pwd.type = isHidden ? 'text' : 'password';
      this.innerHTML = isHidden ? eyeOffSvg : eyeSvg;
    });
  </script>
</body>
</html>
