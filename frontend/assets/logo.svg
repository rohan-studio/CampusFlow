<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Top Flow Wave Gradient -->
    <linearGradient id="cf-flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Lower Flow Wave Gradient -->
    <linearGradient id="cf-flow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cf-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0B0F19" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="40" height="40" rx="11" fill="url(#cf-bg)"/>
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="10.25" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none"/>

  <!-- Top Ambient Specular Sheen -->
  <ellipse cx="20" cy="3" rx="13" ry="3" fill="rgba(255,255,255,0.12)"/>

  <!-- Academic Mortarboard / Campus Gable -->
  <path d="M20 8.5 L31.5 14 L20 19.5 L8.5 14 Z" fill="#FFFFFF" filter="url(#cf-drop)"/>

  <!-- Golden Tassel with Amber Flare -->
  <path d="M31.5 14 V18.5 C31.5 19.5 30.6 20.2 29.5 20.2" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Central Intelligence AI Core -->
  <circle cx="20" cy="14" r="1.6" fill="#4338CA"/>

  <!-- Upper Flow Wave (Speed and Routing) -->
  <path d="M8.5 24.2 C12 21.6 16 21.6 20 23.8 C24 26 28 26 31.5 23.4" 
        stroke="url(#cf-flow1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cf-drop)"/>

  <!-- Lower Flow Wave (Agility and Resolution) -->
  <path d="M11 29.4 C14 27.2 17 27.2 20 28.8 C23 30.4 26 30.4 29 28.2" 
        stroke="url(#cf-flow2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle of Innovation at top right -->
  <path d="M32 4.5 Q32 6 33.5 6 Q32 6 32 7.5 Q32 6 30.5 6 Q32 6 32 4.5 Z" fill="#FDE047"/>
</svg>
